name: AMI Labs
description: 'AMI Labs is a frontier AI research lab building intelligent systems that understand the
  real world. The lab develops world models trained with self-supervised learning on continuous, high-dimensional
  sensor data (cameras and other sensors), aiming for AI with persistent memory, reasoning and planning,
  and controllable, safety-oriented behavior. Targeted applications span industrial process control, automation,
  wearable devices, robotics, and healthcare. Founded by Yann LeCun as Executive Chairman with Alexandre
  LeBrun as CEO, AMI Labs launched officially on 2026-03-10 with a $1.03B USD round co-led by Cathay
  Innovation, Greycroft, Hiro Capital, HV Capital, and Bezos Expeditions, and operates from Paris, New
  York, Montreal, and Singapore. The lab operates as a research organization and publishes no public
  developer platform, API, SDKs, documentation, or machine-readable contract: amilabs.xyz is a two-page
  site whose own sitemap declares only / and /updates, and every OpenAPI, GraphQL, MCP, A2A and
  /.well-known/ discovery path probed on it returns HTTP 404.'
