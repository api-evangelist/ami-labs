name: AMI Labs
description: 'AMI Labs is a frontier AI research lab building intelligent systems that understand the
  real world. The lab develops world models trained with self-supervised learning on continuous, high-dimensional
  sensor data (cameras and other sensors), aiming for AI with persistent memory, reasoning and planning,
  and controllable, safety-oriented behavior. Targeted applications span industrial process control, automation,
  wearable devices, robotics, and healthcare. AMI Labs launched officially in March 2026 with a $1.03B
  funding round and operates from Paris, New York, Montreal, and Singapore. It is backed by HV Capital,
  Obvious Ventures, and Wing Venture Capital. The lab operates as a research organization and does not
  currently publish a public developer platform, API, SDKs, or documentation.'
